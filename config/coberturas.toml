# Dicionário de coberturas (Q38): agrupa por TIPO os nomes usados pela Porto, pela Tokio e pelo SGCOR.
#
# Como o robô usa: no item da renovação o SGCOR já traz as coberturas do ano anterior. Para cada cobertura
# do PDF, o robô acha o TIPO dela aqui e procura no item a cobertura do SGCOR do mesmo TIPO; se houver
# exatamente uma, ajusta o LMI. Sem tipo, tipo ausente no item ou 2+ do mesmo tipo → pendência (Q8).
#
# Os nomes são comparados sem acento, sem pontuação e em maiúsculas, pelo INÍCIO do nome.
# Equivalências validadas pelo consultor em 18/11/2026 (Q48–Q51).

