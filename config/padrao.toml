# Configuração padrão da automação de renovações.
# Valores que mudam a cada campanha/ciclo ficam aqui, não no código.

[datas]
# Vencimento da 1ª parcela (Porto e Tokio)
primeira_parcela = "10/01/2027"
# Vigência da renovação (Q37); proposta Porto com início diferente → pendência (Q44)
vigencia_inicio = "31/12/2026"
vigencia_fim = "31/12/2027"

[apolice]
# Nº provisório lançado em "Apólice" e "Apólice (Baixa comissão)"; o consultor troca na emissão (Q27)
provisoria = "123456"

# Comissão (%) → bônus do consultor (Valor Fixo do repasse), campanha atual (Q5)
[[bonus]]
ate = 16
valor = "18.00"

[[bonus]]
de = 17
ate = 19
valor = "20.00"

[[bonus]]
de = 20
ate = 23
valor = "30.00"

[[bonus]]
de = 24
valor = "40.00"

# Forma de pagamento (como o cliente falou) → value do select "Forma de Cobrança" no SGCOR (Q28)
[cobranca]
boleto = 1
cartao = 4
cartao_porto = 25
debito = 12
pix = 36

[coberturas]
# Q59: o robô só ajusta o LMI destes tipos (chaves de coberturas.toml); as outras ficam como vieram no SGCOR
ajustar = ["incendio", "valores_interior", "valores_transito"]

# Q71: quando a renovação vem de outro ramo (ex.: Caixa Aqui), o robô INCLUI as coberturas desses tipos que faltam
# no item, usando esta linha da tabela "Novo" das coberturas do SGCOR (nome exato)
[coberturas.incluir]
incendio = "INCÊNDIO, RAIO, EXPLOSÃO, IMPLOSÃO E FUMAÇA"
valores_interior = "GERPA - SUB. DE VALORES NO INTERIOR DO ESTABELECIMENTO"
valores_transito = "GERPA - SUB. DE VALORES FORA DO ESTABELECIMENTO"

[renovacao]
# Q71: se a apólice anterior não está no ramo lotérico da seguradora, o robô procura pelo CNPJ nestes ramos
# (em qualquer seguradora) a que termina quando a nova começa
ramos = ["LOTÉRICO", "CAIXA AQUI"]

[atualizacao]
# Ao abrir, o AutoCOR instalado procura versão nova na última Release deste repositório do GitHub
repositorio = "arthursantos082/Automacao-SGCOR-Protege"

[sgcor]
url ="https://grupoprotege.sgcor.com.br/"
# Navegador do robô (Q53): o Chrome instalado na máquina, com perfil próprio. O Chromium do Playwright
# não é assinado e o Controle Inteligente de Aplicativos do Windows 11 o bloqueia. Alternativa: "msedge".
navegador = "chrome"
# Tempo (s) que o robô espera o consultor fazer login na janela dele depois de "Verificar conexão"
espera_login = 300
companhia_porto = 12
companhia_tokio = 13
ramo_loterico = 9
